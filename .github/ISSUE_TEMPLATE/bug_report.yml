name: Bug Report
description: File a bug report to help us improve ce-ai
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in `ce-ai`! Please fill out the form below to help us reproduce and resolve the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you running ce-ai on?
      options:
        - Linux (Ubuntu/Debian/Arch/Fedora)
        - macOS (Apple Silicon ARM64)
        - macOS (Intel x86_64)
        - Windows 11 / Windows 10
    validations:
      required: true

  - type: dropdown
    id: harness
    attributes:
      label: Target Harness
      description: Which AI coding agent harness is affected?
      options:
        - OpenCode (~/.config/opencode)
        - Claude Code (~/.claude.json)
        - Cursor (.cursorrules)
        - GitHub Copilot (.github/copilot-instructions.md)
        - Pi Agent (~/.pi)
        - Kimi Code (~/.kimi-code)
        - Antigravity CLI (~/.gemini/antigravity-cli)
        - All Harnesses
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command 'ce-ai ...'
        2. See error output...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: CLI Logs & Error Output
      description: Paste any error stack trace or `ce-ai doctor` output.
      render: shell
    validations:
      required: false
