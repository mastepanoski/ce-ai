name: Bump Homebrew Tap

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.9). Defaults to the latest release."
        required: false
        type: string

permissions:
  contents: read

jobs:
  bump-tap:
    name: Update tap formula
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing tap formula for $TAG"

      - name: Download release assets and compute checksums
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          cd dist
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          for asset in \
            ce-ai-x86_64-apple-darwin.tar.gz \
            ce-ai-aarch64-apple-darwin.tar.gz \
            ce-ai-x86_64-unknown-linux-gnu.tar.gz \
            ce-ai-aarch64-unknown-linux-gnu.tar.gz; do
            curl -fsSL -o "$asset" "$BASE/$asset" || { echo "::error::Missing release asset $asset for $TAG"; exit 1; }
          done
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Render formula
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cd dist
          read -r MAC_X86 _ < <(sha256sum ce-ai-x86_64-apple-darwin.tar.gz)
          read -r MAC_ARM _ < <(sha256sum ce-ai-aarch64-apple-darwin.tar.gz)
          read -r LINUX_X86 _ < <(sha256sum ce-ai-x86_64-unknown-linux-gnu.tar.gz)
          read -r LINUX_ARM _ < <(sha256sum ce-ai-aarch64-unknown-linux-gnu.tar.gz)
          # Render outside $GITHUB_WORKSPACE so the tap checkout step cannot wipe it.
          cat > "$GITHUB_WORKSPACE/../Formula-ce-ai.rb" <<EOF
          class CeAi < Formula
            desc "CLI for managing the compound-engineering plugin across AI harnesses"
            homepage "https://github.com/mastepanoski/ce-ai"
            version "$VERSION"
            license "MIT"

            if OS.mac? && Hardware::CPU.intel?
              url "https://github.com/mastepanoski/ce-ai/releases/download/v$VERSION/ce-ai-x86_64-apple-darwin.tar.gz"
              sha256 "$MAC_X86"
            elsif OS.mac? && Hardware::CPU.arm?
              url "https://github.com/mastepanoski/ce-ai/releases/download/v$VERSION/ce-ai-aarch64-apple-darwin.tar.gz"
              sha256 "$MAC_ARM"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/mastepanoski/ce-ai/releases/download/v$VERSION/ce-ai-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "$LINUX_X86"
            elsif OS.linux? && Hardware::CPU.arm?
              url "https://github.com/mastepanoski/ce-ai/releases/download/v$VERSION/ce-ai-aarch64-unknown-linux-gnu.tar.gz"
              sha256 "$LINUX_ARM"
            end

            def install
              bin.install "ce-ai"
            end

            test do
              assert_match "ce-ai", shell_output("#{bin}/ce-ai --version")
            end
          end
          EOF

      - name: Push formula to tap repository
        uses: actions/checkout@v4
        with:
          repository: mastepanoski/homebrew-ce-ai
          token: ${{ secrets.TAP_TOKEN }}

      - name: Commit and push
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/../Formula-ce-ai.rb" Formula/ce-ai.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ce-ai.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for $VERSION — nothing to commit."
          else
            git commit -m "ce-ai $VERSION"
            git push origin main
          fi
