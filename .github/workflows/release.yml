name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: ce-ai
            asset_name: ce-ai-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: ce-ai
            asset_name: ce-ai-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: ce-ai
            asset_name: ce-ai-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: ce-ai
            asset_name: ce-ai-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: ce-ai.exe
            asset_name: ce-ai-x86_64-pc-windows-msvc.zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact_name: ce-ai.exe
            asset_name: ce-ai-aarch64-pc-windows-msvc.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install ARM64 GCC Cross-Compiler (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Release Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}

  release-integrity:
    name: Release Integrity Metadata & Homebrew Refresh
    needs: build-release-binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Compute SHA256SUMS and Refresh Homebrew Formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: ./scripts/release-integrity.sh

      - name: Upload SHA256SUMS.txt to Release
        uses: softprops/action-gh-release@v3
        with:
          files: SHA256SUMS.txt

      - name: Open Homebrew Formula Update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BRANCH="chore/homebrew-${TAG_NAME}"
          git config user.name "ce-ai Release Bot"
          git config user.email "me@maurostepanoski.ar"
          git checkout -b "$BRANCH"
          git add Formula/ce-ai.rb
          if git diff --cached --quiet; then
            echo "Formula already tracks ${TAG_NAME}; nothing to do."
            exit 0
          fi
          git commit -m "chore(homebrew): pin ${TAG_NAME} assets with sha256 checksums

          Automated by release.yml via scripts/release-integrity.sh from the
          published ${TAG_NAME} assets. Checks are intentionally absent:
          GitHub does not trigger workflows for GITHUB_TOKEN-created PRs."
          git push --force origin "$BRANCH"
          gh pr create \
            --head "$BRANCH" \
            --title "chore(homebrew): pin ${TAG_NAME} assets with sha256 checksums" \
            --body "Automated tap update for \`${TAG_NAME}\` — URLs and SHA256 checksums regenerated by \`scripts/release-integrity.sh\` from the published release artifacts. Checks do not run on GITHUB_TOKEN-created PRs (GitHub design); merge with admin bypass after a quick diff review." \
            || echo "PR for ${BRANCH} already exists; skipping creation."
