name: CI & Compliance Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test

  security-audit:
    name: Supply Chain Security Audit (ISO 27001 / ISO 27002)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Security Audit
        run: |
          set -o pipefail
          cargo audit | tee audit-output.txt
          {
            echo "## Supply Chain Security Audit"
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pr-size-budget:
    name: PR Size Budget (#108)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute changed lines
        id: size
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          # Exclude lockfiles, openspec changes, and docs per CONTRIBUTING.md §2 counting contract.
          CODE_ADDED=$(git diff --numstat "$BASE"...HEAD -- ':!Cargo.lock' ':!*.lock' ':!openspec/changes/**' ':!docs/**' | awk '{a+=$1} END {print a+0}')
          CODE_DELETED=$(git diff --numstat "$BASE"...HEAD -- ':!Cargo.lock' ':!*.lock' ':!openspec/changes/**' ':!docs/**' | awk '{d+=$2} END {print d+0}')
          CODE_TOTAL=$((CODE_ADDED + CODE_DELETED))

          DOCS_ADDED=$(git diff --numstat "$BASE"...HEAD -- 'openspec/changes/**' 'docs/**' | awk '{a+=$1} END {print a+0}')
          DOCS_DELETED=$(git diff --numstat "$BASE"...HEAD -- 'openspec/changes/**' 'docs/**' | awk '{d+=$2} END {print d+0}')
          DOCS_TOTAL=$((DOCS_ADDED + DOCS_DELETED))

          TOTAL=$((CODE_TOTAL + DOCS_TOTAL))

          echo "code_total=$CODE_TOTAL" >> "$GITHUB_OUTPUT"
          echo "docs_total=$DOCS_TOTAL" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          {
            echo "## PR Size Budget"
            echo ""
            echo "| Metric | Code | Docs & OpenSpec | Total |"
            echo "|---|---|---|---|"
            echo "| Added | $CODE_ADDED | $DOCS_ADDED | $((CODE_ADDED + DOCS_ADDED)) |"
            echo "| Deleted | $CODE_DELETED | $DOCS_DELETED | $((CODE_DELETED + DOCS_DELETED)) |"
            echo "| **Total** | **$CODE_TOTAL** | **$DOCS_TOTAL** | **$TOTAL** |"
            echo ""
            if [ "$CODE_TOTAL" -gt 400 ]; then
              echo "> ⚠️ Code changes exceed the 400-line review boundary ($CODE_TOTAL LOC). Add a \`### Size Exception\` section to your PR body or request a maintainer add the \`size:exception\` label."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check boundary
        run: |
          CODE_TOTAL=${{ steps.size.outputs.code_total }}
          if [ "$CODE_TOTAL" -gt 400 ]; then
            HAS_LABEL=$(gh pr view "${{ github.event.pull_request.number }}" --json labels --jq '[.labels[].name] | contains(["size:exception"])')
            PR_BODY=$(gh pr view "${{ github.event.pull_request.number }}" --json body --jq '.body // ""')

            # Check for size exception directive in PR description (essential for external fork contributors)
            HAS_BODY_EXEMPTION=false
            if echo "$PR_BODY" | grep -Ei -q '(^#{1,4}[[:space:]]*size[[:space:]]+exception|<!--[[:space:]]*size[-:]exception|\b(size[-:]exception):|(\*\*|_)size[[:space:]]+exception(\*\*|_):?)'; then
              HAS_BODY_EXEMPTION=true
            fi

            if [ "$HAS_LABEL" != "true" ] && [ "$HAS_BODY_EXEMPTION" != "true" ]; then
              echo "::error::PR code changes exceed the 400-line review boundary ($CODE_TOTAL LOC). If this change cannot be sliced further, add a '### Size Exception' section with rationale to the PR description, or request a maintainer add the 'size:exception' label."
              exit 1
            fi

            if [ "$HAS_BODY_EXEMPTION" = "true" ]; then
              echo "Size exception granted via PR description directive."
            elif [ "$HAS_LABEL" = "true" ]; then
              echo "Size exception granted via size:exception label."
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Zero AI Attribution Trailers (AGENTS.md Invariant #11)
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          BAD_COMMITS=$(git log --format="%H %s" --extended-regexp --grep="^[[:space:]]*[cC]o-[aA]uthored-[bB]y[[:space:]]*:" "$BASE"...HEAD || true)
          if [ -n "$BAD_COMMITS" ]; then
            echo "::error::Commits contain forbidden Co-Authored-By trailers (AGENTS.md Invariant #11):"
            echo "$BAD_COMMITS"
            exit 1
          fi

  docker-e2e-gate:
    name: Containerized E2E Gate (NIST AI RMF & ISO 42001)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker E2E Test Suite
        run: make e2e

  windows-installation-gate:
    name: Windows PowerShell Installer Gate (NIST SP 800-53)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Test PowerShell install.ps1 Script Execution
        shell: powershell
        run: |
          ./scripts/install.ps1
          $ExePath = "$env:USERPROFILE\.ce-ai\bin\ce-ai.exe"
          if (Test-Path $ExePath) {
              Write-Host "✅ Verified binary exists at $ExePath"
              & $ExePath --version
          } else {
              Write-Error "❌ ce-ai.exe installation binary not found at $ExePath"
              exit 1
          }

  auto-reject-failed-pr:
    name: Auto-Reject PR on CI Failure
    needs: [check-and-test, security-audit, docker-e2e-gate, windows-installation-gate]
    if: always() && contains(needs.*.result, 'failure') && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Comment and Request Changes on Failed PR
        uses: actions/github-script@v9
        with:
          script: |
            const issue_number = context.issue.number;
            const message = `❌ **CI & Compliance Gate Failed — PR Auto-Rejected**\n\n` +
              `This Pull Request failed mandatory CI verification steps (Build, Clippy Linter, Tests, Supply Chain Audit, or Docker E2E Gate).\n\n` +
              `**Required Actions before re-submitting:**\n` +
              `1. Fix all failing compilation, clippy, or unit test errors.\n` +
              `2. Ensure zero security vulnerabilities (\`cargo audit\`).\n` +
              `3. Pass local pre-commit hook (\`make hooks\` / \`./.githooks/pre-commit\`).\n\n` +
              `Push updated commits to re-trigger CI validation.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: message
            }).catch(e => console.error(e));

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number,
              event: 'REQUEST_CHANGES',
              body: 'Automated CI Gate: Rejecting PR due to failed CI checks or security audit.'
            }).catch(e => console.error(e));

