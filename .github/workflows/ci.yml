name: CI & Compliance Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test

  security-audit:
    name: Supply Chain Security Audit (ISO 27001 / ISO 27002)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Security Audit
        run: |
          set -o pipefail
          cargo audit | tee audit-output.txt
          {
            echo "## Supply Chain Security Audit"
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-e2e-gate:
    name: Containerized E2E Gate (NIST AI RMF & ISO 42001)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker E2E Test Suite
        run: make e2e

  windows-installation-gate:
    name: Windows PowerShell Installer Gate (NIST SP 800-53)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Test PowerShell install.ps1 Script Execution
        shell: powershell
        run: |
          ./scripts/install.ps1
          $ExePath = "$env:USERPROFILE\.ce-ai\bin\ce-ai.exe"
          if (Test-Path $ExePath) {
              Write-Host "✅ Verified binary exists at $ExePath"
              & $ExePath --version
          } else {
              Write-Error "❌ ce-ai.exe installation binary not found at $ExePath"
              exit 1
          }

  auto-reject-failed-pr:
    name: Auto-Reject PR on CI Failure
    needs: [check-and-test, security-audit, docker-e2e-gate, windows-installation-gate]
    if: always() && contains(needs.*.result, 'failure') && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Comment and Request Changes on Failed PR
        uses: actions/github-script@v9
        with:
          script: |
            const issue_number = context.issue.number;
            const message = `❌ **CI & Compliance Gate Failed — PR Auto-Rejected**\n\n` +
              `This Pull Request failed mandatory CI verification steps (Build, Clippy Linter, Tests, Supply Chain Audit, or Docker E2E Gate).\n\n` +
              `**Required Actions before re-submitting:**\n` +
              `1. Fix all failing compilation, clippy, or unit test errors.\n` +
              `2. Ensure zero security vulnerabilities (\`cargo audit\`).\n` +
              `3. Pass local pre-commit hook (\`make hooks\` / \`./.githooks/pre-commit\`).\n\n` +
              `Push updated commits to re-trigger CI validation.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: message
            }).catch(e => console.error(e));

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number,
              event: 'REQUEST_CHANGES',
              body: 'Automated CI Gate: Rejecting PR due to failed CI checks or security audit.'
            }).catch(e => console.error(e));

