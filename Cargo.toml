[package]
name = "ce-ai"
version = "1.72.0"
edition = "2021"
description = "Workflow orchestration and governance for Compound Engineering across AI coding agents"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
chrono = "0.4"
toml = "0.8"
ctrlc = "3"
tempfile = "3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
keyring = "4.2"
rpassword = "7.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
sha2 = "0.10"
