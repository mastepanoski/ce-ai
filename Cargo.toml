[package]
name = "ce-ai"
version = "1.0.0"
edition = "2021"
description = "CLI for managing the compound-engineering plugin across AI harnesses"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
chrono = "0.4"
inquire = "0.7"
ratatui = "0.30"
crossterm = "0.28"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
